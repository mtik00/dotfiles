command_timeout = 1000

[package]
disabled = true

[aws]
disabled = true

[python]
format = '[${symbol}(${version})]($style)'

[git_status]
conflicted = '🏳'
# ahead = '🏎💨'
# behind = '😰'
# diverged = '😵'
up_to_date = ''
untracked = '🤷'
stashed = '📦'
modified = '📝'
staged = '[++\($count\)](green)'
renamed = '👅'
deleted = '🗑'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'

[java]
disabled = true

[env_var.CTX]
format = ' 🈸:[$env_value](fg:green)'

[env_var.DESK_NAME]
format = '📝:[$env_value](fg:green)'

[custom.kubernetes]
command = 'kubectl config current-context 2>/dev/null | sed "s|^arn:aws[^:]*:eks:[^:]*:[0-9]*:cluster/||"'
when = 'test -f ~/.config/starship/kube-on'
shell = ['bash', '--noprofile', '--norc']
format = ' ☸ :[$output](fg:blue)'
description = 'Current kubectl context — toggle with kubeon/kubeoff'
